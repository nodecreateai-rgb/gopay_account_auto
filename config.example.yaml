# GoPay Account Auto 配置模板
# 复制为 config.yaml；敏感项请用环境变量（见 .env.example）

# 接码：默认 hero_sms；可选 grizzly_sms（同时设环境变量 SMS_PROVIDER=grizzly_sms）
# sms_provider: hero_sms

# Hero-SMS（api_key 请用环境变量 HERO_SMS_API_KEY）
hero_sms:
  enabled: true
  base_url: "https://hero-sms.com/stubs/handler_api.php"
  country: 6
  service: "ni"
  poll_timeout_sec: 300
  max_price: "0.06"

# GrizzlySMS（仅当 SMS_PROVIDER=grizzly_sms 时使用）
# grizzly_sms:
#   enabled: true
#   base_url: "https://api.grizzlysms.com/stubs/handler_api.php"
#   country: 6
#   service: "ni"
#   poll_timeout_sec: 300
#   max_price: "0.06"

# 代理：GOPAY_PROXY 或 PROXY

account_pay:
  GoPay:
    festival_envelope:
      enabled: false
      short_link: ""
