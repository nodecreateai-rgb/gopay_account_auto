# GoPay Account Auto 配置模板
# 复制为 config.yaml；敏感项请用环境变量（见 .env.example）

# hero-sms（api_key 请用环境变量 HERO_SMS_API_KEY）
hero_sms:
  enabled: true
  base_url: "https://hero-sms.com/stubs/handler_api.php"
  country: 6  # 印尼国家代码
  service: "ni"  # GoPay 服务代码（印尼）
  poll_timeout_sec: 300
  # 取号出价固定 $0.045，见 utils/hero_sms.py

# 代理请用环境变量 GOPAY_PROXY 或 PROXY

# GoPay 账号（PIN / 国家码请用环境变量，见 .env.example）
account_pay:
  GoPay:
    festival_envelope:
      enabled: false
      short_link: ""
