# GoPay Account Auto 配置模板
# 复制为 config.yaml；敏感项请用环境变量（见 .env.example）

# GrizzlySMS 接码（api_key 请用环境变量 GRIZZLY_SMS_API_KEY）
grizzly_sms:
  enabled: true
  base_url: "https://api.grizzlysms.com/stubs/handler_api.php"
  country: 6   # 印尼
  service: "ni"  # GoPay
  poll_timeout_sec: 300
  max_price: "0.045"

# 代理请用环境变量 GOPAY_PROXY 或 PROXY

account_pay:
  GoPay:
    festival_envelope:
      enabled: false
      short_link: ""
